[tools]
node = "26.12.0"
"npm:eas-cli" = "25.3.0"
"npm:expo-doctor" = "1.21.5"

[tasks.install]
description = "Install dependencies from package-lock.json"
run = "npm ci"

[tasks.lint]
description = "Check code with oxlint and formatting of code, Markdown, YAML and JSON with oxfmt"
run = ["npx oxlint --deny-warnings", "npx oxfmt --check"]

[tasks.fix]
description = "Apply safe oxlint fixes and format every file with oxfmt"
run = ["npx oxlint --fix", "npx oxfmt"]

[tasks.typecheck]
description = "Type-check the project with tsc"
run = "npx tsc --noEmit"

[tasks.test]
description = "Run the vitest suite"
run = "npx vitest run"

[tasks.build]
description = "Bundle the app for iOS, Android and web into dist/"
run = "npx expo export"

[tasks.check]
description = "Run lint, typecheck, test and build; writes only the ignored dist/"
depends = ["lint", "typecheck", "test", "build"]

[tasks.setup]
description = "Complete project setup for new developers"
run = ["mise run install", "mise run dev"]

[tasks.dev]
description = "Start development server with cache clearing"
run = "npx expo start --clear"
alias = "d"

[tasks.reset]
description = "Reset development environment (clear cache, reinstall)"
run = ["rm -rf node_modules", "rm -rf .expo", "mise run install", "npx expo install --fix"]

[tasks.build-preview]
description = "Build preview version using EAS"
run = "eas build -p android --profile preview"

[tasks.doctor]
description = "Run Expo doctor to check for common issues"
run = ["expo-doctor", "npx expo install --check"]
